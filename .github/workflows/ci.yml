# The gates, run by GitHub — but only when someone asks for it.
#
# This workspace has no Actions allowance to spend, so nothing here fires on a
# push or a pull request: `npm run check` on the branch, locally, is the gate
# this project actually runs, and docs/conventions.md says so. The workflow is
# kept because it is the same command and costs nothing until triggered, so if
# the allowance ever comes back it is one setting away from automatic again.
#
# Run it from the Actions tab → ci → Run workflow.
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # The API tests run against an in-memory MongoDB; its binary is cached
      # between runs rather than downloaded every time.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund

      - name: lint, typecheck, test, build
        run: npm run check
