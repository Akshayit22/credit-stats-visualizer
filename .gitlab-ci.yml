# ═══════════════════════════════════════════════════════════════════════════
#  cred-stats — Round 1 pipeline
#
#  install → quality → test → build → package   (deploy is a manual placeholder)
#
#  Merge request pipelines and the default branch only. No pipeline on tags:
#  Round 1 has no release flow to hang off one.
#
#  No secret is ever echoed. Everything sensitive comes from masked, protected
#  CI/CD variables (Settings → CI/CD → Variables), and no job prints its env.
# ═══════════════════════════════════════════════════════════════════════════

default:
  # Node 22 rather than 20: the AWS SDK v3 requires node >= 22 from January
  # 2027, and DynamoDB is reached through it. See the note in the Dockerfile.
  image: node:22-alpine
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

stages:
  - install
  - quality
  - test
  - build
  - package
  - deploy

variables:
  # npm's cache, inside the project directory so GitLab can cache it at all.
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  NEXT_TELEMETRY_DISABLED: '1'
  # The pipeline never talks to AWS. Tests that need a table talk to the
  # dynamodb-local service below; everything else runs on fixtures.
  AWS_REGION: 'ap-south-1'
  AWS_ACCESS_KEY_ID: 'local'
  AWS_SECRET_ACCESS_KEY: 'local'
  DDB_TABLE_PREFIX: 'cred-stats-local'
  # No key, no calls. The parser suites and the fallback test run on the mock
  # provider, so a pipeline never spends money at a model vendor.
  LLM_PROVIDER: 'mock'

# Keyed on the lockfile: the cache is reused until a dependency actually moves.
.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
  policy: pull

# Only merge requests and the default branch.
.rules_default: &rules_default
  - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── install ────────────────────────────────────────────────────────────────

install:
  stage: install
  cache:
    <<: *npm_cache
    policy: pull-push
  script:
    # `npm ci` honours the lockfile exactly; postinstall copies the pdf.js
    # worker, whose version must match pdfjs-dist.
    - npm ci --no-audit --fund=false
    - test -f public/pdf.worker.min.mjs
  artifacts:
    expire_in: 1 day
    paths:
      - node_modules/
      - public/pdf.worker.min.mjs
  rules: *rules_default

# ── quality ────────────────────────────────────────────────────────────────
# Two jobs rather than one, so a lint failure and a type error are reported
# together instead of one hiding the other.

lint:
  stage: quality
  needs: ['install']
  cache: *npm_cache
  script:
    - npm run lint
  rules: *rules_default

typecheck:
  stage: quality
  needs: ['install']
  cache: *npm_cache
  script:
    - npm run typecheck
  rules: *rules_default

# ── test ───────────────────────────────────────────────────────────────────

test:
  stage: test
  needs: ['install']
  cache: *npm_cache
  services:
    # The repository and fallback suites run against a real DynamoDB Local
    # rather than a mock, so the key design is exercised by the pipeline.
    - name: amazon/dynamodb-local:latest
      alias: dynamodb-local
      command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-inMemory']
  variables:
    DDB_ENDPOINT: 'http://dynamodb-local:8000'
  before_script:
    # DynamoDB Local answers a bare GET with 400 — that is the "it is up"
    # signal, so accept any HTTP response and only fail on no response at all.
    - apk add --no-cache curl
    - |
      for attempt in $(seq 1 30); do
        if curl -s -o /dev/null "$DDB_ENDPOINT"; then
          echo "dynamodb-local is up"
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          echo "dynamodb-local did not come up in 30s" >&2
          exit 1
        fi
        sleep 1
      done
    - npm run db:create
  script:
    - npm run test -- --coverage
  coverage: '/^All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit.xml
    paths:
      - coverage/
  rules: *rules_default

# ── build ──────────────────────────────────────────────────────────────────

build:
  stage: build
  needs: ['install', 'lint', 'typecheck']
  cache: *npm_cache
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - .next/
  rules: *rules_default

# ── package ────────────────────────────────────────────────────────────────

package:
  stage: package
  needs: ['test', 'build']
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: ['']
  script:
    # Kaniko needs no Docker daemon and no privileged runner.
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<JSON
      {"auths":{"${CI_REGISTRY}":{"username":"${CI_REGISTRY_USER}","password":"${CI_REGISTRY_PASSWORD}"}}}
      JSON
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --build-arg "DOCKER_BUILD=1"
      --single-snapshot
  # The default branch only: a merge request should not publish `latest`.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── deploy ─────────────────────────────────────────────────────────────────

deploy:dev:
  stage: deploy
  needs: ['package']
  image: alpine:3.20
  environment:
    name: dev
  script:
    - echo "Round 1 deploys by hand. When this job is implemented it will:"
    - echo "  1. create the five cred-stats-dev-* tables from infra/tables.json"
    - echo "  2. push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} to the dev service"
    - echo "  3. set DDB_TABLE_PREFIX=cred-stats-dev and leave DDB_ENDPOINT unset,"
    - echo "     so the SDK uses its default resolver and the instance IAM role"
    - echo "  4. wait for /api/health to report status ok with all five tables"
    - echo "Nothing was deployed."
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
