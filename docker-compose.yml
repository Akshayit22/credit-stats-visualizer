services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: cred-stats-local-dynamodb
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-dbPath', '/data']
    working_dir: /home/dynamodblocal
    ports:
      - '8000:8000'
    volumes:
      - ./.docker/dynamodb:/data
    user: root
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'java -version >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: cred-stats-local-dynamodb-admin
    ports:
      - '8001:8001'
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb-local

  # Optional: run the app itself in a container — `docker compose --profile app up`
  app:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cred-stats-local-app
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DDB_ENDPOINT: http://dynamodb-local:8000
      DDB_TABLE_PREFIX: cred-stats-local
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    env_file:
      - path: .env.local
        required: false
    depends_on:
      - dynamodb-local
