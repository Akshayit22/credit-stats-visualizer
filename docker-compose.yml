# Local MongoDB for development — and, optionally, the production image.
#
#   npm run db:up      start MongoDB (:27017) and mongo-express (:8081)
#   npm run db:down    stop them; the data survives in the named volume
#
#   docker compose --profile app up --build
#                      also build and run the production image on :4000,
#                      API and web app together, exactly as Render runs it
#
# Production uses MongoDB Atlas. The API reaches both through MONGODB_URI and
# nothing else differs.

services:
  mongo:
    image: mongo:8.2
    container_name: cred-stats-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Browse every document at http://localhost:8081 (local only — no auth).
  mongo-express:
    image: mongo-express:1.0
    container_name: cred-stats-mongo-express
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      mongo:
        condition: service_healthy

  # The production image: NODE_ENV=production, so there is no demo sign-in and
  # a session secret is required. Set CRED_STATS_SESSION_SECRET (and
  # GOOGLE_CLIENT_ID to sign in) in your shell or backend/.env first.
  app:
    profiles: ['app']
    build: .
    container_name: cred-stats-app
    ports:
      - '4000:4000'
    env_file:
      - path: backend/.env
        required: false
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017
      # Unset, the API refuses to start and says so; compose need not.
      CRED_STATS_SESSION_SECRET: ${CRED_STATS_SESSION_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
