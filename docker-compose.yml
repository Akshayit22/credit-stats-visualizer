# Local MongoDB for development.
#
#   npm run db:up      start MongoDB (:27017) and mongo-express (:8081)
#   npm run db:down    stop them; the data survives in the named volume
#
# Production uses MongoDB Atlas. The API reaches both through MONGODB_URI and
# nothing else differs.

services:
  mongo:
    image: mongo:8.2
    container_name: cred-stats-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Browse every document at http://localhost:8081 (local only — no auth).
  mongo-express:
    image: mongo-express:1.0
    container_name: cred-stats-mongo-express
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
